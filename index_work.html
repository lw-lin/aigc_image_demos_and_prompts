                        { "image": "details_work/Z_作品集_工程/AI90+Hum10(VerA)/img.png", "desc": "AI90+Hum10(VerA)", "tooltip": { "source": "【source】\nsome source", "prompt": "【prompt】\nsome prompt", "extra_info": "【extra_info】\n收集时间：2025.11.23" } },
                        { "image": "details_work/Z_作品集_工程/AI90+Hum10(VerB)/img.png", "desc": "AI90+Hum10(VerB)", "tooltip": { "source": "【source】\nsome source", "prompt": "【prompt】\nsome prompt", "extra_info": "【extra_info】\n收集时间：2025.11.23" } },
                        { "image": "details_work/Z_作品集_工程/Cursor 实现原理架构图/img.png", "desc": "Cursor 实现原理架构图", "tooltip": { "source": "【source】\nsome source", "prompt": "【prompt】\n[有一个具体的 pdf 文件]\n将 pdf 内容画成一张 info graphics", "extra_info": "【extra_info】\n收集时间：2025.12.02" } },
                        { "image": "details_work/Z_作品集_工程/LLM KV Cache 科普总结/img.png", "desc": "LLM KV Cache 科普总结", "tooltip": { "source": "【source】\nsome source", "prompt": "【prompt】\n第 1 轮：帮忙科普 llm 的 kvcache 的来龙去脉\n第 2 轮：帮忙把上述内容画成一张图片（中文）", "extra_info": "【extra_info】\n收集时间：2025.11.28" } },
                        { "image": "details_work/Z_作品集_工程/gemini 原生多模态原理图/img.png", "desc": "gemini 原生多模态原理图", "tooltip": { "source": "【source】\nsome source", "prompt": "【prompt】\n第 1 轮：画一幅图，说明 Gemini 原生多模态的原理\n第 2 轮：重画：用中文，并体现更多技术原理细节", "extra_info": "【extra_info】\n收集时间：2025.11.23" } },

                    ]
                }

        // 动态生成表格
        function generateTable() {
            const table = document.createElement('table');
            const COLUMNS_PER_ROW = 5; // 每行固定 5 列
            
            tableData.rows.forEach((row, rowIndex) => {
                const cells = row.cells || [];
                const rowsNeeded = Math.ceil(cells.length / COLUMNS_PER_ROW); // 当前行的cells需要多少行
                
                // 如果当前行有 category，需要计算 rowspan
                // rowspan = 当前行的cells需要的行数
                let categoryRowspan = null;
                if (row.category) {
                    categoryRowspan = rowsNeeded;
                }
                
                // 将当前行的cells按每行5个分组
                for (let rowOffset = 0; rowOffset < rowsNeeded; rowOffset++) {
                    const tr = document.createElement('tr');
                    
                    // 处理左侧列 - 只在第一行创建，并设置 rowspan
                    if (row.category && rowOffset === 0) {
                        const leftTd = document.createElement('td');
                        leftTd.textContent = row.category;
                        leftTd.setAttribute('rowspan', categoryRowspan);
                        tr.appendChild(leftTd);
                    }
                    
                    // 计算当前行应该显示的cells范围
                    const startIndex = rowOffset * COLUMNS_PER_ROW;
                    const endIndex = Math.min(startIndex + COLUMNS_PER_ROW, cells.length);
                    
                    // 处理当前行的单元格
                    for (let i = startIndex; i < endIndex; i++) {
                        const cell = cells[i];
                        if (!cell || !cell.image || !cell.tooltip) {
                            console.error(`第 ${rowIndex + 1} 行第 ${i + 1} 列的单元格数据不完整`, cell);
                            // 创建空单元格
                            const td = document.createElement('td');
                            tr.appendChild(td);
                            continue;
                        }
                        
                        const td = document.createElement('td');
                        
                        const cellContent = document.createElement('div');
                        cellContent.className = 'cell-content';
                        
                        const img = document.createElement('img');
                        img.src = cell.image;
                        img.alt = '图片';
                        
                        // 创建图片预览容器
                        const imagePreview = document.createElement('div');
                        imagePreview.className = 'image-preview';
                        const previewImg = document.createElement('img');
                        previewImg.src = cell.image;
                        previewImg.alt = '放大预览';
                        imagePreview.appendChild(previewImg);
                        document.body.appendChild(imagePreview);
                        
                        // 图片悬停显示预览
                        let previewTimeout = null;
                        img.addEventListener('mouseenter', function(e) {
                            if (previewTimeout) {
                                clearTimeout(previewTimeout);
                            }
                            previewTimeout = setTimeout(function() {
                                imagePreview.style.display = 'block';
                                // 使用 requestAnimationFrame 确保预览窗口已渲染
                                requestAnimationFrame(function() {
                                    updatePreviewPosition(imagePreview, e);
                                });
                            }, 300); // 300ms 延迟显示
                        });
                        
                        img.addEventListener('mousemove', function(e) {
                            if (imagePreview.style.display === 'block') {
                                updatePreviewPosition(imagePreview, e);
                            }
                        });
                        
                        img.addEventListener('mouseleave', function() {
                            if (previewTimeout) {
                                clearTimeout(previewTimeout);
                                previewTimeout = null;
                            }
                            imagePreview.style.display = 'none';
                        });
                        
                        cellContent.appendChild(img);
                        
                        const detailText = document.createElement('span');
                        detailText.className = 'detail-text';
                        detailText.textContent = cell.desc || 'detail';
                        
                        const tooltip = document.createElement('div');
                        tooltip.className = 'tooltip';
                        const source = cell.tooltip.source || '';
                        const prompt = cell.tooltip.prompt || '';
                        const extra_info = cell.tooltip.extra_info || '';
                        tooltip.textContent = source + '\n\n' + prompt + '\n\n' + extra_info;
                        
                        detailText.appendChild(tooltip);
                        cellContent.appendChild(detailText);
                        
                        td.appendChild(cellContent);
                        tr.appendChild(td);
                    }
                    
                    // 如果单元格不足 5 个，补充空单元格
                    for (let i = endIndex - startIndex; i < COLUMNS_PER_ROW; i++) {
                        const td = document.createElement('td');
                        tr.appendChild(td);
                    }
                    
                    table.appendChild(tr);
                }
            });
            
            return table;
        }

        // 更新图片预览位置
        function updatePreviewPosition(preview, event) {
            const previewRect = preview.getBoundingClientRect();
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const offset = 20;
            
            let left = event.clientX + offset;
            let top = event.clientY + offset;
            
            // 如果预览窗口超出右边界，显示在鼠标左侧
            if (left + previewRect.width > viewportWidth) {
                left = event.clientX - previewRect.width - offset;
            }
            
            // 如果预览窗口超出下边界，显示在鼠标上方
            if (top + previewRect.height > viewportHeight) {
                top = event.clientY - previewRect.height - offset;
            }
            
            // 确保不超出左边界和上边界
            if (left < 0) left = offset;
            if (top < 0) top = offset;
            
            preview.style.left = left + 'px';
            preview.style.top = top + 'px';
        }

        // 调整 tooltip 位置，避免超出屏幕
        function adjustTooltipPosition(tooltip, trigger) {
            // 重置样式
            tooltip.classList.remove('tooltip-below');
            tooltip.style.left = '';
            tooltip.style.right = '';
            tooltip.style.top = '';
            tooltip.style.bottom = '';
            tooltip.style.transform = 'translateX(-50%)';
            
            // 使用 requestAnimationFrame 确保 tooltip 已经显示
            requestAnimationFrame(function() {
                const tooltipRect = tooltip.getBoundingClientRect();
                const triggerRect = trigger.getBoundingClientRect();
                const viewportWidth = window.innerWidth;
                const viewportHeight = window.innerHeight;
                
                // 检测是否超出顶部（默认显示在上方）
                const spaceAbove = triggerRect.top;
                const spaceBelow = viewportHeight - triggerRect.bottom;
                const tooltipHeight = tooltipRect.height;
                
                // 如果上方空间不足，且下方空间足够，则显示在下方
                if (spaceAbove < tooltipHeight + 20 && spaceBelow > tooltipHeight + 20) {
                    tooltip.classList.add('tooltip-below');
                }
                
                // 重新计算位置
                const newTooltipRect = tooltip.getBoundingClientRect();
                
                // 调整左右位置
                let leftOffset = 0;
                if (newTooltipRect.left < 10) {
                    leftOffset = 10 - newTooltipRect.left;
                } else if (newTooltipRect.right > viewportWidth - 10) {
                    leftOffset = viewportWidth - 10 - newTooltipRect.right;
                }
                
                if (leftOffset !== 0) {
                    tooltip.style.transform = `translateX(calc(-50% + ${leftOffset}px))`;
                }
            });
        }

        // 页面加载完成后生成表格并设置 tooltip 位置调整
        document.addEventListener('DOMContentLoaded', function() {
            // 创建页面标题
            const header = document.createElement('div');
            header.className = 'page-header';
            const h1 = document.createElement('h1');
            h1.textContent = 'Awesome AI Generated Images and Prompts';
            const subtitle = document.createElement('div');
            subtitle.className = 'subtitle';
            subtitle.textContent = 'Last Update at 2025.12.06';
            header.appendChild(h1);
            header.appendChild(subtitle);
            document.body.appendChild(header);
            
            const table = generateTable();
            document.body.appendChild(table);
            
            // 为所有 tooltip 添加位置调整和显示/隐藏控制
            const detailTexts = document.querySelectorAll('.detail-text');
            detailTexts.forEach(detailText => {
                const tooltip = detailText.querySelector('.tooltip');
                if (tooltip) {
                    let hideTimeout = null;
                    
                    // 显示 tooltip
                    function showTooltip() {
                        if (hideTimeout) {
                            clearTimeout(hideTimeout);
                            hideTimeout = null;
                        }
                        tooltip.style.display = 'block';
                        adjustTooltipPosition(tooltip, detailText);
                    }
                    
                    // 隐藏 tooltip（带延迟）
                    function hideTooltip() {
                        hideTimeout = setTimeout(function() {
                            tooltip.style.display = 'none';
                            hideTimeout = null;
                        }, 100); // 100ms 延迟，给鼠标时间移动到 tooltip
                    }
                    
                    // 取消隐藏
                    function cancelHide() {
                        if (hideTimeout) {
                            clearTimeout(hideTimeout);
                            hideTimeout = null;
                        }
                    }
                    
                    // 当鼠标进入文字时显示
                    detailText.addEventListener('mouseenter', showTooltip);
                    // 当鼠标离开文字时准备隐藏（但给时间移动到 tooltip）
                    detailText.addEventListener('mouseleave', hideTooltip);
                    
                    // 当鼠标进入 tooltip 时取消隐藏并调整位置
                    tooltip.addEventListener('mouseenter', function() {
                        cancelHide();
                        showTooltip();
                    });
                    // 当鼠标离开 tooltip 时隐藏
                    tooltip.addEventListener('mouseleave', function() {
                        tooltip.style.display = 'none';
                    });
                }
            });
        });
    </script>

        }

        }
        
        .cell-content img {
            max-width: 150px;
            max-height: 150px;
            object-fit: contain;
            cursor: pointer;
        }
        
        .image-preview {
            display: none;
            position: fixed;
            z-index: 10000;
            pointer-events: none;
            border: 3px solid #fff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            background: white;
            overflow: hidden;
        }
        
        .image-preview img {
            display: block;
            max-width: 1000px;
            max-height: 1000px;
            width: auto;
            height: auto;
            object-fit: contain;
        }
        
        .detail-text {
            color: #999;
            cursor: help;
            position: relative;
        }
        
        .tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 5px);
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            text-align: left;
            white-space: pre-line;
            user-select: text;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            pointer-events: auto;
            min-width: 100px;
            max-width: 400px;
            max-height: 300px;
            overflow-y: auto;
            word-wrap: break-word;
        }
        
        .tooltip.tooltip-below {
            bottom: auto;
            top: calc(100% + 10px);
        }
        
        .tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: #333;
            margin-top: -1px;
        }
        
        .tooltip.tooltip-below::after {
            top: auto;
            bottom: 100%;
            border-top-color: transparent;
            border-bottom-color: #333;
            margin-top: 0;
            margin-bottom: -1px;
        }
        
    </style>
